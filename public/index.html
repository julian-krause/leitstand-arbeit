<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leitstand">
<title>Leitstand</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Leitstand <span class="brand-sub">Arbeitsversion</span></div>
  <nav class="tabs" id="tabs">
    <button data-view="overview" class="active">Übersicht</button>
    <button data-view="chats">Chats</button>
    <button data-view="files">Dateien</button>
    <button data-view="pages">Seiten</button>
    <button data-view="freigaben">Freigaben <span class="tab-count" id="tab-freigaben-count" hidden></span></button>
    <button data-view="vault">Tresor</button>
    <button data-view="projects">Projekte</button>
    <button data-view="settings">Einstellungen</button>
  </nav>
  <div class="topbar-right">
    <span class="meter" id="meter-running"></span>
  </div>
</header>

<div class="capsule" id="capsule" hidden></div>

<main id="view-overview" class="view"><section class="scroll" id="overview"></section></main>

<main id="view-chats" class="view" hidden>
  <aside class="sidebar">
    <button type="button" class="zentrale-entry" id="zentrale-entry"><span class="z-text"><b>Zentrale</b></span></button>
    <button class="primary wide" id="new-chat">Neuer Auftrag</button>
    <div class="filters" id="chat-filter"></div>
    <div id="chat-list"></div>
  </aside>
  <section class="chat" id="chat"></section>
</main>

<main id="view-pages" class="view" hidden>
  <aside class="sidebar">
    <button class="primary wide" id="new-page">Neue Seite</button>
    <p class="hint">Gemeinsamer Kontext: Alle Agenten lesen und schreiben hier. Seiten sind <code>.md</code>, Tabellen <code>.csv</code>.</p>
    <div id="page-list"></div>
  </aside>
  <section class="page" id="page"></section>
</main>

<main id="view-files" class="view" hidden>
  <aside class="sidebar" id="files-list"></aside>
  <section class="page" id="files-preview"></section>
</main>

<main id="view-freigaben" class="view" hidden><section class="scroll" id="freigaben"></section></main>
<main id="view-vault" class="view" hidden><section class="scroll" id="vault"></section></main>
<main id="view-projects" class="view" hidden><section class="scroll" id="projects"></section></main>
<main id="view-settings" class="view" hidden><section class="scroll" id="settings"></section></main>

<dialog id="dialog"></dialog>
<!-- Vorschläge für das Modell (wie bei copilot --model); frei eintippen geht auch -->
<datalist id="model-list">
  <option value="auto"></option>
  <option value="claude-sonnet-4.5"></option>
  <option value="claude-opus-4.5"></option>
  <option value="gpt-5"></option>
  <option value="gpt-5-mini"></option>
</datalist>
<script type="module" src="/app.js"></script>
</body>
</html>
